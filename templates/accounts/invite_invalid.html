{% extends "base.html" %}
{% load static %}
{% block title %}Enlace no válido · {{ SITE_NAME }}{% endblock %}

{% block public_content %}
<div class="flex min-h-screen flex-col justify-center py-12 px-4 text-center">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="card p-8">
            <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-red-500/15">
                <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <h1 class="mt-4 text-xl font-bold text-gray-900">Enlace no válido o caducado</h1>
            <p class="mt-2 text-sm text-gray-500">Pide a tu entrenador que te genere un nuevo enlace de invitación.</p>
            <a href="{% url 'accounts:login' %}" class="btn-secondary mt-6">Ir al inicio de sesión</a>
        </div>
    </div>
</div>
{% endblock %}
