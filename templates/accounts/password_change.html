{% extends "base.html" %}
{% block title %}Cambiar contraseña · {{ SITE_NAME }}{% endblock %}
{% block page_title %}Cambiar contraseña{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="card p-6">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% include 'components/form_fields.html' %}
            <div class="pt-2 flex justify-end gap-2">
                <a href="{% url 'accounts:profile' %}" class="btn-ghost">Cancelar</a>
                <button type="submit" class="btn-primary">Actualizar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
