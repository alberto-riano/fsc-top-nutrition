{% extends "base.html" %}
{% block title %}Contraseña actualizada · {{ SITE_NAME }}{% endblock %}

{% block public_content %}
<div class="flex min-h-screen flex-col justify-center py-12 px-4 text-center">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="card p-8">
            <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-brand-500/15">
                <svg class="w-6 h-6 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <h1 class="mt-4 text-xl font-bold text-white">¡Contraseña actualizada!</h1>
            <p class="mt-2 text-sm text-gray-400">Ya puedes iniciar sesión con tu nueva contraseña.</p>
            <a href="{% url 'accounts:login' %}" class="btn-primary mt-6">Iniciar sesión</a>
        </div>
    </div>
</div>
{% endblock %}
