{% extends "base.html" %}
{% load static %}
{% block title %}Revisa tu correo · {{ SITE_NAME }}{% endblock %}

{% block public_content %}
<div class="flex min-h-screen flex-col justify-center py-12 px-4 text-center">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="card p-8">
            <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-brand-500/15">
                <svg class="w-6 h-6 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            </div>
            <h1 class="mt-4 text-xl font-bold text-white">Revisa tu correo</h1>
            <p class="mt-2 text-sm text-gray-400">Si el email existe, recibirás un enlace para restablecer tu contraseña.</p>
            <a href="{% url 'accounts:login' %}" class="btn-secondary mt-6">Volver al inicio de sesión</a>
        </div>
    </div>
</div>
{% endblock %}
