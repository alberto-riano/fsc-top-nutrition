{% comment %}
Calendario mensual de asistencia a sesiones. Variables requeridas:
  - calendar_id: id único (se usa para el <script> de datos y el x-data)
  - sessions_calendar: lista de dicts (ver bonos/services.py:sessions_calendar_data)
{% endcomment %}
<div class="card p-5" x-data="topTrackCalendar('{{ calendar_id }}')">
    <div class="flex items-center justify-between mb-4">
        <h3 class="section-title">Calendario de sesiones</h3>
        <div class="flex items-center gap-1">
            <button type="button" class="btn-ghost !px-2" @click="prev()" aria-label="Mes anterior">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <span class="text-sm font-semibold text-gray-700 w-32 text-center capitalize" x-text="monthLabel"></span>
            <button type="button" class="btn-ghost !px-2" @click="next()" aria-label="Mes siguiente">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>
    </div>

    <template x-if="Object.keys(byDay).length">
        <div>
            <div class="grid grid-cols-7 gap-1 text-center text-[11px] uppercase text-gray-400 mb-1">
                <template x-for="wd in weekdays" :key="wd"><div x-text="wd"></div></template>
            </div>
            <div class="grid grid-cols-7 gap-1">
                <template x-for="(d, idx) in days" :key="idx">
                    <button type="button"
                            @click="d && d.count ? select(d.date) : null"
                            class="aspect-square rounded-lg flex flex-col items-center justify-center text-xs relative"
                            :class="{
                                'invisible': !d,
                                'cursor-default text-gray-600': d && !d.count,
                                'cursor-pointer hover:bg-surface-secondary': d && d.count && d.date !== selected,
                                'bg-brand-600 text-white font-bold': d && d.date === selected,
                                'bg-brand-50 text-brand-700 font-semibold': d && d.count && d.date !== selected,
                            }">
                        <span x-text="d ? d.day : ''"></span>
                        <span x-show="d && d.count > 1" x-cloak x-text="d ? d.count : ''"
                              class="absolute -top-0.5 -right-0.5 bg-amber-500 text-white rounded-full text-[9px] leading-none w-3.5 h-3.5 flex items-center justify-center"></span>
                    </button>
                </template>
            </div>

            <div x-show="selected" x-cloak class="mt-4 pt-4 border-t border-surface-border space-y-2">
                <template x-for="s in selectedSessions" :key="s.time + s.type">
                    <div class="text-sm">
                        <p class="font-medium text-gray-800" x-text="s.time + ' · ' + s.type"></p>
                        <p class="text-gray-500" x-show="s.notes" x-text="s.notes"></p>
                    </div>
                </template>
            </div>
        </div>
    </template>
    <p x-show="!Object.keys(byDay).length" class="text-sm text-gray-500 text-center py-6">Sin sesiones registradas todavía.</p>
</div>
{{ sessions_calendar|json_script:calendar_id }}
