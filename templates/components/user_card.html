<div class="flex-shrink-0 border-t border-surface-border p-4">
    <a href="{% url 'accounts:profile' %}" class="flex items-center gap-3 px-2 py-2 mb-2 rounded-xl text-sm font-medium text-gray-400 hover:bg-surface-secondary hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Mi cuenta
    </a>
    <div class="flex items-center gap-3">
        {% if user.avatar %}
        <img src="{{ user.avatar.url }}" alt="" class="w-9 h-9 rounded-full object-cover">
        {% else %}
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center">
            <span class="text-sm font-bold text-black">{{ user.first_name|slice:":1"|upper|default:user.email|slice:":1"|upper }}</span>
        </div>
        {% endif %}
        <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-white truncate">{{ user.display_name }}</p>
            <p class="text-xs text-gray-500 truncate">{{ user.get_role_display }}</p>
        </div>
        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="p-1.5 rounded-lg text-gray-500 hover:text-white hover:bg-surface-secondary transition-colors" title="Cerrar sesión">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            </button>
        </form>
    </div>
</div>
